<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>X 互关检测</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" class="logo" />
      <div class="brand-text">
        <h1>X 互关检测</h1>
        <p id="account" class="muted">正在检测页面…</p>
      </div>
    </div>
    <button id="recheck" class="icon-btn" title="重新检测页面状态">⟳</button>
  </header>

  <section class="quota" id="quota">
    <div class="q-top">
      <span class="q-label">今日还能关注</span>
      <span class="q-num"><b id="qLeft">—</b><i id="qLimit">/ 400</i></span>
      <button id="qToggle" class="q-toggle" aria-expanded="false" title="展开每日明细 / 校准">明细</button>
    </div>
    <div class="q-bar"><span id="qFill"></span></div>
    <div class="q-meta">
      <span id="qUsed">已关注 0</span>
      <span class="q-dot">·</span>
      <span id="qReset">重置倒计时 —</span>
      <span class="q-dot">·</span>
      <span id="qUnf">取关 0</span>
    </div>

    <div class="q-detail" id="qDetail" hidden>
      <div class="q-chart" id="qChart"></div>
      <p class="q-caption"><span id="qCaption">近 14 天</span><span id="qPeak"></span></p>
      <p class="q-ratio" id="qRatio" hidden></p>
      <div class="q-row">
        <select id="qMode" class="mini-select" title="「一天」从哪里算起">
          <option value="pt">美西 0 点</option>
          <option value="rolling">滚动 24h</option>
        </select>
        <span class="q-spacer"></span>
        <button id="qExport" class="q-link" title="导出近 14 天每日关注数">导出</button>
      </div>
      <div class="q-row">
        <input id="qSetVal" class="q-input" type="number" min="0" max="400" step="1" placeholder="实际已用" title="X 上实际已关注多少个，填这里校准" />
        <button id="qSetBtn" class="q-link">校准</button>
        <span class="q-spacer"></span>
        <button id="qCap" class="q-link" aria-pressed="false" title="X 提示「You are unable to follow more people at this time」时点这里，今天就算满了；再点一次取消">标记已满</button>
      </div>
    </div>
  </section>

  <section class="scan-box">
    <label class="opt">
      <input type="checkbox" id="withFollowers" checked />
      <span>同时拉取粉丝列表<small>（统计纯粉丝 / 掉粉，页数翻倍）</small></span>
    </label>
    <div class="row">
      <button id="scanBtn" class="primary" disabled>开始扫描</button>
      <button id="intelBtn" class="ghost" disabled title="读通知流，统计最近谁跟你互动最多">扫互动</button>
      <button id="stopBtn" class="ghost" hidden>停止</button>
    </div>
    <div id="progress" class="progress" hidden>
      <div class="bar"><span id="barFill"></span></div>
      <p id="progressText" class="muted small"></p>
    </div>
    <p id="hint" class="hint"></p>
  </section>

  <section class="stats" id="stats" hidden>
    <div class="stat"><b id="stFollowing">-</b><span>关注</span></div>
    <div class="stat ok"><b id="stMutual">-</b><span>互关</span></div>
    <div class="stat warn"><b id="stNotBack">-</b><span>未回关</span></div>
    <div class="stat warn clickable" id="cardNotBackBlue" title="点击：只看未回关的蓝V">
      <b id="stNotBackBlue">-</b><span>未回关蓝V ›</span>
    </div>
    <div class="stat warn clickable" id="cardNotBackNon" title="点击：只看未回关、没有蓝V的">
      <b id="stNotBackNon">-</b><span>未回关非V ›</span>
    </div>
    <div class="stat"><b id="stPure">-</b><span>纯粉丝</span></div>
    <div class="stat extra"><b id="stRate">-</b><span>互关率</span></div>
    <div class="stat clickable" id="cardStale" title="点击：半年以上没发帖的人">
      <b id="stStale">-</b><span>半年未更 ›</span>
    </div>
    <div class="stat clickable" id="cardZero" title="点击：一条推文都没发过的号">
      <b id="stZero">-</b><span>零推文 ›</span>
    </div>
  </section>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="notBack" class="active">未回关 <em>0</em></button>
    <button data-tab="mutual">互关 <em>0</em></button>
    <button data-tab="pureFans">纯粉丝 <em>0</em></button>
    <button data-tab="interact">互动 <em>0</em></button>
    <button data-tab="stale">沉默 <em>0</em></button>
    <button data-tab="changes">变化 <em>0</em></button>
  </nav>

  <section class="toolbar" id="toolbar" hidden>
    <input id="search" type="search" placeholder="搜索昵称 / @用户名 / 简介" />
    <!-- 选项由 panel.js 的 renderSortOptions() 按当前 tab 生成：每个 tab 只列自己有数据的排序 -->
    <select id="sortBy" class="mini-select" title="排序方式"></select>
    <button id="blueOnly" class="chip" aria-pressed="false" title="点一下只看蓝V，再点只看非蓝V">蓝V</button>
    <button id="exportBtn" class="ghost">导出</button>
  </section>

  <nav class="chips" id="staleChips" hidden></nav>

  <main id="list" class="list">
    <div class="empty">
      <p>点「开始扫描」读取你的关注列表。</p>
      <p class="muted small">只读取公开数据，不上传任何内容。</p>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
